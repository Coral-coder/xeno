name: Xeno
options:
  bundleIdPrefix: com.lightwave
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Xeno:
    type: application
    platform: iOS
    sources:
      - path: Xeno
    scheme: {}
    info:
      path: Xeno/Info.plist
      properties:
        CFBundleDisplayName: Xeno
        UIAppFonts:
          - XenoDot.ttf
          - XenoDotMid.ttf
          - XenoDotBig.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: Xeno uses Bluetooth to read your wireless HVAC probes (pressure, temperature, humidity, vacuum and static pressure).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightwave.xeno
        PRODUCT_NAME: Xeno
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Automatic
