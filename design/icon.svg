<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#14304a"/>
      <stop offset="0.55" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#03050c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#4dff9a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4dff9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9dffc4"/>
      <stop offset="0.45" stop-color="#46e88a"/>
      <stop offset="1" stop-color="#18a45a"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffb3"/>
      <stop offset="1" stop-color="#22b866"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1c"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a96a8"/>
      <stop offset="0.45" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#7c879a"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#b8390a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="120" cy="140" r="4" opacity=".8"/><circle cx="210" cy="300" r="2.5" opacity=".5"/>
    <circle cx="880" cy="120" r="3.5" opacity=".8"/><circle cx="930" cy="330" r="2" opacity=".5"/>
    <circle cx="90" cy="560" r="3" opacity=".6"/><circle cx="300" cy="80" r="2" opacity=".6"/>
    <circle cx="760" cy="60" r="2.5" opacity=".6"/><circle cx="960" cy="620" r="3" opacity=".5"/>
    <circle cx="160" cy="880" r="2.5" opacity=".5"/><circle cx="640" cy="930" r="2" opacity=".4"/>
  </g>
  <circle cx="512" cy="450" r="430" fill="url(#glow)"/>

  <!-- head -->
  <g filter="url(#soft)">
    <path d="M512 905 C 380 880 230 720 205 520 C 180 300 330 130 512 130 C 694 130 844 300 819 520 C 794 720 644 880 512 905 Z" fill="url(#skin)"/>
  </g>
  <!-- head highlight -->
  <path d="M370 210 C 430 168 520 158 590 178 C 520 185 440 210 390 260 Z" fill="#fff" opacity=".35"/>
  <!-- eyes -->
  <g>
    <path d="M250 470 C 270 390 360 380 440 440 C 480 470 470 560 430 590 C 360 640 240 560 250 470 Z" fill="url(#eye)"/>
    <path d="M774 470 C 754 390 664 380 584 440 C 544 470 554 560 594 590 C 664 640 784 560 774 470 Z" fill="url(#eye)"/>
    <ellipse cx="330" cy="460" rx="30" ry="18" fill="#bfffe0" opacity=".85" transform="rotate(-25 330 460)"/>
    <ellipse cx="694" cy="460" rx="30" ry="18" fill="#bfffe0" opacity=".85" transform="rotate(25 694 460)"/>
    <circle cx="380" cy="515" r="7" fill="#4dff9a" opacity=".7"/>
    <circle cx="644" cy="515" r="7" fill="#4dff9a" opacity=".7"/>
  </g>
  <!-- small mouth -->
  <path d="M478 770 Q 512 790 546 770" stroke="#0d6e3a" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- temperature probe: long steel rod with tip, orange grip, mini display -->
  <g transform="rotate(18 760 760)" filter="url(#soft)">
    <rect x="746" y="400" width="20" height="320" rx="10" fill="url(#steel)"/>
    <path d="M746 400 L 756 360 L 766 400 Z" fill="#dfe6ef"/>
    <rect x="712" y="700" width="88" height="250" rx="34" fill="url(#grip)"/>
    <rect x="728" y="725" width="56" height="70" rx="10" fill="#0a1426"/>
    <text x="756" y="772" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#4dff9a" text-anchor="middle">72°</text>
    <rect x="740" y="820" width="32" height="10" rx="5" fill="#7a2506" opacity=".6"/>
    <rect x="740" y="845" width="32" height="10" rx="5" fill="#7a2506" opacity=".6"/>
  </g>

  <!-- three-fingered hand gripping the probe handle -->
  <g filter="url(#soft)">
    <!-- arm/wrist from bottom right -->
    <path d="M985 1024 C 960 940 920 880 862 852 L 820 930 C 860 960 890 1000 905 1024 Z" fill="url(#hand)"/>
    <!-- palm -->
    <ellipse cx="840" cy="860" rx="78" ry="62" fill="url(#hand)" transform="rotate(-32 840 860)"/>
    <!-- three long fingers wrapped over the grip -->
    <path d="M790 820 C 740 800 700 790 690 770 C 684 755 700 744 716 750 C 740 760 770 778 806 792 Z" fill="url(#hand)"/>
    <path d="M800 858 C 745 850 700 846 686 826 C 678 812 692 800 710 804 C 738 810 776 822 812 830 Z" fill="url(#hand)"/>
    <path d="M812 896 C 760 900 718 900 702 884 C 692 872 704 858 722 860 C 750 864 786 868 820 866 Z" fill="url(#hand)"/>
    <!-- fingertip pads -->
    <circle cx="698" cy="762" r="15" fill="#9dffc4"/>
    <circle cx="694" cy="816" r="15" fill="#9dffc4"/>
    <circle cx="708" cy="873" r="15" fill="#9dffc4"/>
    <!-- thumb-ish knuckle highlight -->
    <path d="M820 820 C 850 810 880 822 890 845" stroke="#c9ffe0" stroke-width="6" fill="none" opacity=".5" stroke-linecap="round"/>
  </g>
</svg>
